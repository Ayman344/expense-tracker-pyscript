# Based on GitHub's "Python application" starter workflow, adapted to unittest + coverage.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install coverage
    - name: Build (compile all Python sources)
      run: python -m compileall -q core.py main.py tests
    - name: Run tests with coverage
      run: |
        set +e
        python -m coverage run --branch -m unittest discover -s tests -v 2>&1 | tee test-output.txt
        status=${PIPESTATUS[0]}
        {
          echo "### Test results"
          echo '```'
          tail -n 40 test-output.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit $status
    - name: Coverage report
      if: always()
      run: python -m coverage report -m --include=core.py
